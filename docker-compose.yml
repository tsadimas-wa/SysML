services:
  postgres:
    image: postgres:13
    container_name: sysml2-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sysml2
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sysml2"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: ${IMAGE_PREFIX:-ghcr.io/nhaskaris}/sysml-api:${API_TAG:-2026-04}
    build:
      context: ./api
      args:
        API_TAG: ${API_TAG:-2026-04}
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: sysml2
      DB_USER: postgres
      DB_PASSWORD: postgres
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-.}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${API_PORT:-9000}:9000"
    volumes:
      - sbt-cache:/root/.sbt
      - ivy-cache:/root/.ivy2
      - coursier-cache:/root/.cache/coursier
    healthcheck:
      # first request triggers sbt/Play compilation, so allow a long start period
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/projects || exit 1"]
      interval: 15s
      timeout: 120s
      retries: 40
      start_period: 120s

  jupyter:
    image: ${IMAGE_PREFIX:-ghcr.io/nhaskaris}/sysml-jupyter:${RELEASE_TAG:-2026-08}
    build:
      context: ./jupyter
      args:
        RELEASE_TAG: ${RELEASE_TAG:-2026-08}
    environment:
      ISYSML_API_BASE_PATH: http://api:9000
    command: >
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root
      --ServerApp.token=${JUPYTER_TOKEN:-} --ServerApp.password=
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${JUPYTER_PORT:-8888}:8888"
    volumes:
      - ./notebooks:/home/jovyan/notebooks

volumes:
  pgdata:
  sbt-cache:
  ivy-cache:
  coursier-cache:
