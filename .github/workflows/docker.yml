name: Build and publish Docker images

on:
  push:
    branches: [main]
    paths: [api/**, jupyter/**, .github/workflows/docker.yml]
  workflow_dispatch:
    inputs:
      api_tag:
        description: SysML-v2-API-Services tag
        default: "2026-04"
      release_tag:
        description: SysML-v2-Release (Jupyter kernel) tag
        default: "2026-08"

permissions:
  contents: read
  packages: write

env:
  API_TAG: ${{ inputs.api_tag || '2026-04' }}
  RELEASE_TAG: ${{ inputs.release_tag || '2026-08' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sysml-api
            context: ./api
            build_arg: API_TAG
            tag_var: API_TAG
          - name: sysml-jupyter
            context: ./jupyter
            build_arg: RELEASE_TAG
            tag_var: RELEASE_TAG
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image names
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          echo "version=${{ env[matrix.tag_var] }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            ${{ matrix.build_arg }}=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
